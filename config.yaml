# AIForUs configuration (non-secret settings only).
# Secrets such as LLM_API_KEY go in the environment or a .env file.
# Unknown keys are rejected at startup, so typos fail loudly.
# Every key is optional; the defaults live in aiforus/config.py.

app:
  name: "AIForUs Vision Assistant"
  language: "id"          # id (Bahasa Indonesia) | en (English)
  data_dir: "data"        # SQLite DB with face data and preferences
  log_level: "INFO"

speech:
  rate: 170               # words per minute (pyttsx3 only; Piper uses piper_length_scale)
  volume: 1.0
  listen_timeout_s: 5
  phrase_time_limit_s: 10
  # pyttsx3 only: substrings used to pick an installed OS voice per language.
  voice_hints:
    id: ["indonesian", "id-id", "id_id", "andika", "gadis"]
    en: ["english", "en-us", "en_us", "en-gb", "zira", "david"]
  recognition_locale:
    id: "id-ID"
    en: "en-US"
  # Voice engine: auto (Piper if installed and downloaded, else pyttsx3) | piper | pyttsx3
  engine: "auto"
  # Piper voices per language; download with: python -m aiforus --download-voices
  piper_voices:
    id: "id_ID-news_tts-medium"
    en: "en_US-lessac-medium"
  piper_dir: "models/piper"
  piper_length_scale: 1.0   # > 1 speaks slower, < 1 faster

camera:
  index: 0
  width: 1280
  height: 720
  flush_frames: 4         # discard buffered frames so captures are fresh
  dark_threshold: 25      # mean brightness below this = "too dark"
  blank_std_threshold: 6  # pixel std below this = "lens covered"
  horizontal_fov_deg: 70  # camera field of view; drives clock directions and distances

vision:
  detector_model: "yolov8n.pt"
  detection_confidence: 0.5
  ocr_languages: ["id", "en"]
  ocr_confidence: 0.5
  max_objects_spoken: 6
  max_text_regions_spoken: 5
  face_height_m: 0.21     # typical face box height; used to measure how far people are

face:
  enabled: true
  # opencv: YuNet + SFace, small ONNX models that also run on Raspberry Pi,
  #         Jetson and phones (download with: python -m aiforus --download-models)
  # dlib:   face_recognition library (pip install -e .[faces]; desktop only)
  backend: "opencv"
  quantized: false        # true = int8 models (~10 MB instead of ~39 MB) for edge devices
  model_dir: "models/opencv"
  detection_confidence: 0.8
  detection_model: "hog"  # dlib only: hog (fast, CPU) | cnn (accurate, needs GPU)
  # match_threshold: 1.128  # max embedding distance; empty = backend default (lower = stricter)
  max_samples_per_person: 10
  enroll_samples: 3       # samples saved per "kenali wajah" command (from different frames)
  enroll_timeout_s: 4     # how long enrollment keeps trying to see exactly one face

navigation:
  enabled: true
  routing_url: "https://router.project-osrm.org"
  routing_profile: "foot"
  geocoding_url: "https://nominatim.openstreetmap.org/search"
  ip_location_url: "https://ipinfo.io/json"
  http_timeout_s: 8
  walking_speed_mps: 1.2

llm:
  enabled: true           # used only for general questions, never for commands
  # Any OpenAI-compatible endpoint. Empty = OpenAI (needs LLM_API_KEY / OPENAI_API_KEY).
  # Free, local and offline with Ollama: base_url "http://localhost:11434/v1" and
  # model = a model you pulled with `ollama pull <name>`.
  base_url:
  model: "gpt-4o-mini"
  timeout_s: 30           # local models on a CPU can be slow
  max_tokens: 200

emergency:
  contacts: []            # sending alerts is not implemented yet
  local_emergency_number: "112"
