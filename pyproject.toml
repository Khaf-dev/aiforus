[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiforus"
version = "0.2.0"
description = "Voice-first vision assistant for blind and low-vision people (research prototype)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Khaf-dev" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Adaptive Technologies",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
# Core: everything needed to run the assistant logic and the test-suite.
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "numpy>=1.24",
    "sqlalchemy>=2.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Microphone input + offline voice output.
voice = ["SpeechRecognition>=3.10", "pyttsx3>=2.90", "PyAudio>=0.2.13"]
# Camera, object detection (YOLOv8) and OCR (EasyOCR).
vision = ["opencv-python>=4.8", "ultralytics>=8.0", "easyocr>=1.7"]
# Face recognition (dlib). On Windows this needs CMake + C++ build tools.
faces = ["face_recognition>=1.3"]
# General questions answered by an LLM (needs OPENAI_API_KEY).
llm = ["openai>=1.0"]
all = ["aiforus[voice,vision,faces,llm]"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
aiforus = "aiforus.cli:main"

[tool.setuptools.packages.find]
include = ["aiforus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["experimental", "documentation", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM"]
ignore = ["E501"]  # long message strings are fine; the formatter handles code

[tool.ruff.lint.per-file-ignores]
"aiforus/locales.py" = ["E501"]
